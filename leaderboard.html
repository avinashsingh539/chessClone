<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | ChessClone</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">♟ ChessClone</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
                    <li class="nav-item"><a class="nav-link active" href="leaderboard.html">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                    <li class="nav-item"><a class="btn btn-success ms-lg-3 login-btn" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Leaderboard Content -->
    <div class="container mt-5">

        <h2 class="text-center text-white mb-4">
            Global Leaderboard
        </h2>

        <div class="table-responsive">

            <table class="table table-dark table-hover table-bordered align-middle text-center">

                <thead class="table-success">

                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Rating</th>
                    </tr>

                </thead>

                <tbody id="leaderboardBody">

                </tbody>

            </table>

        </div>

    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/leaderboard.js"></script>

<script>
const settings = JSON.parse(localStorage.getItem("settings"));

if(settings){

    if(settings.darkMode){

        document.body.classList.add("dark-theme");

    }
    else{

        document.body.classList.add("light-theme");

    }

}
else{

    document.body.classList.add("dark-theme");

}
</script>

</body>

</html>

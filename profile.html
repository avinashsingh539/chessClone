<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | ChessClone</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

<div class="container">

<a class="navbar-brand fw-bold fs-3" href="index.html">

♟ ChessClone

</a>

<div>

<a href="play.html" class="btn btn-success me-2">

Play

</a>

<button class="btn btn-danger" id="logoutBtn">

Logout

</button>

</div>

</div>

</nav>


<div class="container mt-5">

<div class="row">

<div class="col-lg-4">

<div class="card profile-card">

<div class="card-body text-center">

<img src="images/avatar.png"
class="profile-img">

<h3 class="mt-3" id="userName">

Username

</h3>

<p id="userEmail">

Email

</p>

<button class="btn btn-success mt-2">

Edit Profile

</button>

</div>

</div>

</div>

<div class="col-lg-8">

<div class="row">

<div class="card shadow p-3 mt-4">

    <h3>Statistics</h3>

    <hr>

    <p><strong>Games Played :</strong> <span id="games">0</span></p>

    <p><strong>Wins :</strong> <span id="wins">0</span></p>

    <p><strong>Losses :</strong> <span id="losses">0</span></p>

    <p><strong>Draws :</strong> <span id="draws">0</span></p>

    <p><strong>Win Rate :</strong> <span id="winRate">0%</span></p>

</div>

<div class="col-md-4">

<div class="card info-card">

<div class="card-body text-center">

<h2 id="games">

0

</h2>

<p>

Games

</p>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card info-card">

<div class="card-body text-center">

<h2 id="wins">

0

</h2>

<p>

Wins

</p>

</div>

</div>

</div>

</div>


<div class="card recent-card mt-4">

<div class="card-body">

<h4>

Recent Games

</h4>

<ul class="list-group mt-3">

<li class="list-group-item">

No games played yet.

</li>

</ul>

</div>

</div>

</div>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="js/profile.js"></script>

<script>
const settings = JSON.parse(localStorage.getItem("settings"));

if(settings){

    if(settings.darkMode){

        document.body.classList.add("dark-theme");

    }
    else{

        document.body.classList.add("light-theme");

    }

}
else{

    document.body.classList.add("dark-theme");

}
</script>

</body>

</html>

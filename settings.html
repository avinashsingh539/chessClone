<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | ChessClone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">♟ ChessClone</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="play.html">Play</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="settings.html">Settings</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                ⚙ Settings
            </h2>

            <div class="form-check form-switch mb-3">

                <input class="form-check-input" type="checkbox" id="darkMode">

                <label class="form-check-label">
                    Dark Theme
                </label>

            </div>

            <div class="form-check form-switch mb-3">

                <input class="form-check-input" type="checkbox" id="sound">

                <label class="form-check-label">
                    Enable Sounds
                </label>

            </div>

            <div class="form-check form-switch mb-3">

                <input class="form-check-input" type="checkbox" id="highlight">

                <label class="form-check-label">
                    Show Legal Move Highlights
                </label>

            </div>

            <label class="mt-3 mb-2">
                AI Difficulty
            </label>

            <select class="form-select" id="difficulty">

                <option>Easy</option>

                <option>Medium</option>

                <option>Hard</option>

            </select>

            <button class="btn btn-success mt-4 w-100" id="saveSettings">

                Save Settings

            </button>

        </div>

    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>

<script>
const settings = JSON.parse(localStorage.getItem("settings"));

if(settings){

    if(settings.darkMode){

        document.body.classList.add("dark-theme");

    }
    else{

        document.body.classList.add("light-theme");

    }

}
else{

    document.body.classList.add("dark-theme");

}
</script>

</body>

</html>
